<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion Multilingual AI Readiness Checker</title>
<meta name="description" content="Gap analysis for global AI rollouts: language coverage, evals, safety and locale handling per language. Free tool by Zion Tech Group.">
<style>
:root{--bg:#0b1016;--card:#131b28;--acc:#7dd3fc;--txt:#e8f1fa;--mut:#93a6bf}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{padding:48px 24px 24px;text-align:center;background:linear-gradient(160deg,#123048,#0b1016)}
h1{margin:0 0 8px}.wrap{max-width:960px;margin:0 auto;padding:24px}
.panel{background:var(--card);border:1px solid #203654;border-radius:14px;padding:20px;margin-bottom:20px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #2a4a6e;background:#0e1622;color:var(--txt)}
.langs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.langs label{background:#0e1622;border:1px solid #2a4a6e;border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.langs input{width:auto;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px;border-bottom:1px solid #1d3248;text-align:left}
.risk-high{color:#f87171}.risk-med{color:#fbbf24}.risk-low{color:#34d399}
footer{padding:32px 24px;text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid #1a2a3d;margin-top:40px}
footer a{color:var(--acc);text-decoration:none;margin:0 8px}
</style>
</head>
<body>
<header><h1>🌍 Zion Multilingual AI Readiness Checker</h1>
<p>Select your target languages and product surface — get a gap report: tokenizer efficiency, eval coverage, safety and locale pitfalls.</p></header>
<div class="wrap">
<div class="panel">
<label>Product surface</label><select id="surf"><option>Customer support chat</option><option>RAG knowledge assistant</option><option>Content generation</option><option>Voice agent</option></select>
<label>Target languages</label>
<div class="langs" id="langs"></div>
<button onclick="gen()" style="margin-top:14px;padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#06182b;font-weight:700;cursor:pointer">Analyze gaps</button>
</div>
<div class="panel" id="result" style="display:none"><table id="t"></table></div>
</div>
<footer>Part of the <a href="https://ziontechgroup.com">Zion Tech Group</a> AI apps network ·
<a href="https://ziontechgroup.com/zion-eval-generator/">Eval Generator</a>
<a href="https://ziontechgroup.com/zion-agent-contract-tests/">Contract Tester</a>
<a href="https://ziontechgroup.com/translation-services/">Zion language services</a></footer>
<script>
const L=[['English','en','Tier 1'],['Portuguese','pt','Tier 1'],['Spanish','es','Tier 1'],['French','fr','Tier 1'],['German','de','Tier 1'],['Italian','it','Tier 1'],['Japanese','ja','Tier 2'],['Korean','ko','Tier 2'],['Chinese (Simplified)','zh','Tier 2'],['Arabic','ar','Tier 3'],['Hindi','hi','Tier 3'],['Thai','th','Tier 3'],['Swahili','sw','Tier 3']];
document.getElementById('langs').innerHTML=L.map((l,i)=>`<label><input type="checkbox" value="${i}" ${i<3?'checked':''}>${l[0]}</label>`).join('');
function gen(){
const surf=document.getElementById('surf').value;
const sel=[...document.querySelectorAll('#langs input:checked')].map(x=>L[+x.value]);
if(!sel.length){alert('Select at least one language.');return;}
const rows=sel.map(([name,code,tier])=>{
const tok=tier==='Tier 1'?'~1.0x English':tier==='Tier 2'?'1.3–1.8x tokens':'2–4x tokens (cost & latency risk)';
const evals=tier==='Tier 1'?'Public benchmarks exist':'Build own golden set (Eval Generator)';
const risk=tier==='Tier 3'?'risk-high':tier==='Tier 2'?'risk-med':'risk-low';
const extra=(code==='ar')?'RTL layout + direction handling':(code==='ja'||code==='zh'||code==='ko'||code==='th')?'No whitespace tokenization; script-aware chunking':(code==='hi'||code==='sw')?'Limited safety classifiers; human review advised':'Standard locale formats (date/number/currency)';
return `<tr><td><b>${name}</b> <small style="color:var(--mut)">${tier}</small></td><td>${tok}</td><td>${evals}</td><td class="${risk}">${extra}</td></tr>`;}).join('');
document.getElementById('t').innerHTML=`<thead><tr><th>Language</th><th>Tokenizer cost</th><th>Eval strategy</th><th>Key risk</th></tr></thead><tbody>${rows}</tbody></table><p style="color:var(--mut);font-size:.85rem;margin-top:10px">Surface: <b>${surf}</b>. Rule of thumb: re-run your golden eval set per language before launch; Tier 3 languages need native-speaker review.</p>`;
document.getElementById('result').style.display='block';}
</script>
</body>
</html>
